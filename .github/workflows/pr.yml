name: PR checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/rustup@v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check

  build:
    name: Build (warning-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/rustup@v1
        with:
          toolchain: stable
      - run: cargo build --workspace --all-targets 2>&1 | tee build.log
      - run: |
          if grep -q "warning:" build.log; then
            echo "Build produced warnings:"
            grep "warning:" build.log
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/rustup@v1
        with:
          toolchain: stable
      - run: cargo test --workspace --exclude cownfs-bench
