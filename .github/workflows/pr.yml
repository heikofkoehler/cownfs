name: PR checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check

  build:
    name: Build (warning-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo build --workspace --all-targets 2>&1 | tee build.log
      - run: |
          if grep -q "warning:" build.log; then
            echo "Build produced warnings:"
            grep "warning:" build.log
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      # P4 scaling gate requires 16 cores (GitHub runners have 4).
      # The test is RED by design on smaller machines; do not weaken.
      - run: cargo test --workspace --exclude cownfs-bench -- --skip p4_parallel_reads_scale
